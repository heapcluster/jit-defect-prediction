[pytest]
# 后端测试基线（2026-10-13 建立，配合 docs/common/test-strategy.md §5）
# 跑法：cd backend && python -m pytest -q
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 命名约定：test_<行为>_<期望结果>
# 覆盖率（需 pip install pytest-cov）：python -m pytest --cov=app --cov-report=term-missing
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
