[pytest]
# 后端测试基线（配合 docs/common/test-strategy.md §5）
# 跑法：cd backend && python -m pytest -q
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 命名约定：test_<行为>_<期望结果>
# 覆盖率（需 pip install pytest-cov）：python -m pytest --cov=app --cov-report=term-missing
addopts = -q --strict-markers
markers =
    unit: 纯函数 / 离线测试，不连接数据库
    integration: 需要 MySQL jit_test 的接口 / SQL / 事务测试
    no_feature_mock: 关闭全局特征现算 mock，用于 feature_source 自身单测
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
