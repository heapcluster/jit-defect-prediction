schema: spec-driven

context: |
  项目为 JIT 缺陷预测系统，以 commit 为单位输出建议性风险预警，不把预测结果作为 PR 强制门禁。
  现行设计入口：docs/README.md；范围与数据流：docs/overview.md。
  技术契约按对象拆分：docs/api/、docs/database/、docs/function_point/、docs/web_page/。
  当前设计为 5 张表、4 个页面；四条模型线共 25 模型，在线可用模型以实际交付权重为准。
  模型交付的 14 维列序见 data_model/pipelines/expert/models/feature_order.txt。
  训练/检验必须按 committed_at 时间序前 70% / 后 30% 切分，不得随机切分。
  数据库及特征列用 snake_case；布尔字段以 is_ 开头，时间字段以 _at 结尾并使用 UTC。
  API 前缀 /api，响应包络 {"code":0,"message":"ok","data":{...}}；端点详情及错误码以 docs/api/ 为准。
  数据与模型：data_model/；后端：backend/；前端：frontend/；工程化：infra/；docs/ 和 openspec/ 公共维护、蒋励统稿。
  飞书看板是任务负责人、状态与时间的权威；todo/ 只是临时拆解，不得据此宣布任务完成。
  改代码须同步改规格；技术契约变更须显式记录 change，并与对应 docs 一起评审。
  不得提交数据集、权重、.env 或密钥；不得直接推送 main。

rules:
  proposal:
    - 说明为什么做、改变什么、不做什么；范围变化指向 docs/overview.md。
  specs:
    - 每条 Requirement 用稳定标题和 SHALL/MUST，至少写正常及必要的异常或边界 Scenario；MODIFIED 标题须与活规格完全相同。
  design:
    - 只记录技术决策与取舍，不复制 proposal；AI 生成的图标明工具与原始提示词。
  tasks:
    - 按 openspec/TASKS_TEMPLATE.md 写文件头、连续编号、可验收交付和末尾五节「测试与验证」。
    - 跨线任务写明接收人、输入与输出；未执行的验证如实记录，不能先勾选。

operations:
  apply:
    guidance:
      - 实现前核对 docs/ 对应现行技术契约；提交时附运行命令和实测证据。
  archive:
    guidance:
      - 归档前核对活规格、代码和 docs/ 一致，Scenario 有证据，飞书状态已更新。
