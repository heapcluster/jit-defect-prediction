schema: spec-driven

# OpenSpec 的唯一写作入口：openspec/README.md；tasks 模板：docs/common/openspec-task-template.md。
# 产品需求与排期以飞书为准，本文件只给生成器提供仓库内事实和写作约束。
context: |
  项目是 JIT 缺陷预测系统：对代码提交预测缺陷风险，供评审员优先查看高风险提交；预测是建议，不是合入门禁。
  数据源为 Apache Camel；离线链路含 SZZ 打标、Kamei 14 维特征、时间顺序切分训练。
  后端使用 Python/FastAPI/SQLAlchemy/MySQL 8；前端使用 Vue 3、Element Plus、ECharts。
  当前设计全貌见 docs/overview.md；具体接口、表、功能点和页面分别见 docs/api/、docs/database/、docs/function_point/、docs/web_page/。
  已归档的规格条款见 openspec/specs/；进行中的变更见 openspec/changes/；归档为历史，不得拿归档代替活规格。活规格与最新设计或代码不一致时提出变更，不静默改口径。
  字段名、接口路径、模型范围和错误码以对应现行规格及设计为准，不自行发明；有冲突时在 proposal 中列明并请负责人裁定。
  变更说明及代码用中文书写，保留 SHALL/MUST、Requirement、Scenario、WHEN/THEN 等 OpenSpec 关键字。
  不提交数据集、模型权重、.env、密钥或个人绝对路径。

rules:
  proposal:
    - 按 Why、What Changes、Capabilities、Impact 写清原因、改动、不做什么和受影响模块；只引用飞书需求，不在仓库另立任务清单。
    - 行为、接口、字段、数据口径改变时指出受影响的活规格和设计文档；纯重构说明行为不变及回归依据。
  design:
    - 只记录约束、技术选项、决策理由、风险和待确认项；不复制 proposal 正文。没有实质取舍时可不建，须在 tasks 头说明。
    - AI 生成的图须标明工具与原始提示词。
  tasks:
    - 格式见 docs/common/openspec-task-template.md；文件头四行、任务编号连续、每项写可验收的交付物，跨线任务写明接收方。
    - 活跃 change 必须有 .openspec.yaml，写明 schema 与 created；无规格增量时显式写 skip_specs；归档历史保持原貌。
    - 末尾保留测试与验证五节：单元、集成、验收、非功能、已知缺口；命令与证据据实填写，未执行要说明原因和计划。
    - 任务勾选不等于测试或验收通过；纯排版问题作为建议，缺失验证路径、虚假证据或契约冲突须修正。

operations:
  apply:
    guidance:
      - 先对照 openspec/specs/ 与 docs/overview.md，行为变更同步对应规格增量；实现和测试证据一起交付。
      - 同一 capability 的同名 MODIFIED Requirement 与其他活跃 change 冲突时先协调，不让归档静默覆盖语义。
  archive:
    guidance:
      - 合入且验证后归档；确认 tasks 证据真实、已知缺口已登记，活规格与实际交付一致。
      - changes/archive/ 为历史记录，不因新模板批量重排。
