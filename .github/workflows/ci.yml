name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # main 的必需检查使用此固定名称；所有阶段在同一 job 内顺序执行。
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      OPENSPEC_TELEMETRY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            data_model/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r data_model/requirements.txt

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0 --ignore-scripts --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint Python
        run: python -m ruff check backend data_model infra

      - name: Lint specifications
        # 仅检查活规格，不回头重排存量 change；tasks 十项检查仍由 PR 审阅把关。
        run: openspec validate --specs --strict --no-interactive

      - name: Test CI contract
        run: python -m unittest discover -s infra/tests -p 'test_*.py' -v

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Test frontend
        # main 尚无前端测试；测试配置/用例一旦合入即执行，失败不能被忽略。
        if: hashFiles('frontend/vitest.config.*', 'frontend/src/**/__tests__/**', 'frontend/src/**/*.test.*') != ''
        working-directory: frontend
        run: npm run test:unit

      - name: Test data model
        if: hashFiles('data_model/tests/test_*.py') != ''
        working-directory: data_model
        run: python -m pytest -q

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Python
        # Python 无打包入口；这里验证可编译性，不冒充模型训练/交付验收。
        run: python -m compileall -q backend/app data_model infra
