name: 应用运行与核心回归

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # 保留 ruleset 的必需检查标识 CI，避免既有 PR 因检查名迁移而卡住。
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 后端测试套件依赖 MySQL（conftest 的 session 级 engine 读 DATABASE_URL 指向 jit_test）：
    # 起一个一次性 mysql:8.0 service，端口映射到 127.0.0.1:3306，
    # 由下面的「准备测试库」步骤用仓库自己的 infra/setup_mysql.py 建 jit_demo + jit_test 并执行 schema.sql。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      # 后端 pytest 的库：与 services.mysql 对应；backend/.env 不入库，环境变量优先于 .env
      DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/jit_test?charset=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$GROUP_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            base=""
          fi
          python3 infra/ci_scope.py "$base" > "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Report lightweight PR
        if: steps.scope.outputs.lightweight == 'true'
        run: echo 'Only documentation changed; runtime checks are not needed.'

      - name: Setup Node
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python environment
        if: steps.scope.outputs.python == 'true'
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: data_model/environment.yml
          activate-environment: jit-defect-prediction

      - name: Install frontend dependencies
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare test database
        if: steps.scope.outputs.backend == 'true'
        # 用仓库自己的建库脚本备好 jit_demo + jit_test 并执行 schema.sql（顺带在 CI 里验证该脚本本身）
        run: |
          python infra/setup_mysql.py \
            --database-url "mysql+pymysql://root:root@127.0.0.1:3306/jit_demo?charset=utf8mb4" \
            --test-db jit_test --skip-start

      - name: Test infra
        if: steps.scope.outputs.infra == 'true'
        run: python -m pytest -q infra/tests

      - name: Test backend
        if: steps.scope.outputs.backend == 'true'
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml

      - name: Archive backend coverage
        if: always() && steps.scope.outputs.backend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/htmlcov/
            backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Test frontend
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test:unit -- --coverage

      - name: Archive frontend coverage
        if: always() && steps.scope.outputs.frontend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Test data model
        if: steps.scope.outputs.model == 'true'
        working-directory: data_model
        run: python -m pytest -q

      - name: Build frontend
        if: steps.scope.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Build Python
        if: steps.scope.outputs.python == 'true'
        # Python 无打包入口；这里验证可编译性，不冒充模型训练/交付验收。
        # -x 跳过 data_model/data/ 下的 Apache Camel 检出（含不是 Python 的 .py 模板），
        # 否则本机有该目录时这一步会误报，CI 里没有该目录时又看不出来。
        run: |
          paths=()
          if [[ '${{ steps.scope.outputs.backend }}' == 'true' ]]; then paths+=(backend/app); fi
          if [[ '${{ steps.scope.outputs.model }}' == 'true' ]]; then paths+=(data_model); fi
          if [[ '${{ steps.scope.outputs.infra }}' == 'true' ]]; then paths+=(infra); fi
          python -m compileall -q -x 'data_model[\\/]data' "${paths[@]}"
