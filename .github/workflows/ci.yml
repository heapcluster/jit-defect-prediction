name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # main 的必需检查使用此固定名称；所有阶段在同一 job 内顺序执行。
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 后端测试套件依赖 MySQL（conftest 的 session 级 engine 读 DATABASE_URL 指向 jit_test）：
    # 起一个一次性 mysql:8.0 service，端口映射到 127.0.0.1:3306，
    # 由下面的「准备测试库」步骤用仓库自己的 infra/setup_mysql.py 建 jit_demo + jit_test 并执行 schema.sql。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      OPENSPEC_TELEMETRY: "0"
      # 后端 pytest 的库：与 services.mysql 对应；backend/.env 不入库，环境变量优先于 .env
      DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/jit_test?charset=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python environment
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: data_model/environment.yml
          activate-environment: jit-defect-prediction

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Ruff
        # 版本只从唯一环境文件读取，不在工作流中另设依赖清单。
        run: |
          ruff_spec="$(sed -nE 's/^[[:space:]]+- (ruff==[0-9.]+)[[:space:]]*$/\1/p' data_model/environment.yml)"
          test -n "$ruff_spec"
          python -m pip install --no-deps "$ruff_spec"

      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.11.0 --ignore-scripts --no-audit --no-fund

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Lint Python
        run: python -m ruff check backend data_model infra --output-format concise

      - name: Lint specifications
        # 仅检查活规格，不回头重排存量 change；tasks 十项检查仍由 PR 审阅把关。
        run: openspec validate --specs --strict --no-interactive

      - name: Check live documentation links
        run: python infra/check_spec_references.py links

      - name: Check OpenSpec MODIFIED collisions
        run: python infra/check_spec_references.py deltas

      - name: Test CI contract
        run: python -m unittest discover -s infra/tests -p 'test_*.py' -v

      - name: Prepare test database
        # 用仓库自己的建库脚本备好 jit_demo + jit_test 并执行 schema.sql（顺带在 CI 里验证该脚本本身）
        run: |
          python infra/setup_mysql.py \
            --database-url "mysql+pymysql://root:root@127.0.0.1:3306/jit_demo?charset=utf8mb4" \
            --test-db jit_test --skip-start

      - name: Test backend
        working-directory: backend
        run: python -m pytest -q

      - name: Test frontend
        # 测试配置/用例一旦合入即执行，失败不能被忽略。
        if: hashFiles('frontend/vitest.config.*', 'frontend/src/**/__tests__/**', 'frontend/src/**/*.test.*', 'frontend/tests/**/*.spec.*') != ''
        working-directory: frontend
        run: npm run test:unit

      - name: Test data model
        if: hashFiles('data_model/tests/test_*.py') != ''
        working-directory: data_model
        run: python -m pytest -q

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Python
        # Python 无打包入口；这里验证可编译性，不冒充模型训练/交付验收。
        run: python -m compileall -q backend/app data_model infra
